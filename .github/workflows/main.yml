name: Coleta e Atualizacao IFData

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: write
      pages: write
      id-token: write

    env:
      ORACLE_DB_USER: ${{ secrets.ORACLE_DB_USER }}
      ORACLE_DB_PASSWORD: ${{ secrets.ORACLE_DB_PASSWORD }}
      ORACLE_DB_DSN: ${{ secrets.ORACLE_DB_DSN }}
      ORACLE_DB_WALLET_DIR: ${{ github.workspace }}/wallet
      ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD }}
      SCRAPE_LATEST_ONLY: "1"

    steps:
      - uses: actions/checkout@v6

      - run: sudo timedatectl set-timezone America/Sao_Paulo

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Configurar Wallet do Oracle Cloud
        env:
          WALLET_BASE64: ${{ secrets.ORACLE_DB_WALLET_BASE64 }}
        run: |
          mkdir -p ${{ github.workspace }}/wallet
          echo "$WALLET_BASE64" | base64 -d > ${{ github.workspace }}/wallet.zip
          unzip -o ${{ github.workspace }}/wallet.zip -d ${{ github.workspace }}/wallet
        if: "${{ env.WALLET_BASE64 != '' }}"

      - name: Extrair dados IFData
        run: python run_all.py --scraper-only --sequential
        continue-on-error: true
        timeout-minutes: 120

      - name: Normalizar e enriquecer
        run: |
          python run_all.py --normalize-only || true
          python scripts/enriquecer_cadastro.py || true
        continue-on-error: true

      - name: Métricas derivadas e catálogo
        run: |
          python run_all.py --derivadas-only || true
          python run_all.py --generate-catalog || true
        continue-on-error: true

      - name: Upload de Metadados e CSVs Auxiliares
        run: python scripts/upload_meta_csvs.py || true
        continue-on-error: true

      - name: Gerar pipeline_status.js para o dashboard
        run: python run_all.py || true

      - name: Configurar git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commitar dados atualizados
        run: |
          git add data/ config/
          git diff --cached --quiet || \
            git commit -m "Bot: Atualizacao IFData - $(date +'%Y-%m-%d')"

      - name: Push
        run: git push origin main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
