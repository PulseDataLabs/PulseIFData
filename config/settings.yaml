odata:
  base_url: "https://olinda.bcb.gov.br/olinda/servico/IFDATA/versao/v1/odata"
  endpoints:
    valores: "IfDataValores(AnoMes=@AnoMes,TipoInstituicao=@TipoInstituicao,Relatorio=@Relatorio)"
    cadastro: "IfDataCadastro(AnoMes=@AnoMes)"
    relatorios: "ListaDeRelatorio()"

extraction:
  pagination:
    top: 5000
    cadastro_top: 100
    max_retries: 3
    retry_delay: 5
  rate_limit: 1.0

  reports:
    - id: "1"
      name: "Resumo"
    - id: "2"
      name: "Ativo"
    - id: "3"
      name: "Passivo"
    - id: "4"
      name: "Demonstração de Resultado"
    - id: "5"
      name: "Informações de Capital"
    - id: "6"
      name: "Segmentação"
    - id: "7"
      name: "Carteira de Crédito Ativa - Por indexador"
    - id: "8"
      name: "Carteira de crédito ativa - por nível de risco da operação"
    - id: "9"
      name: "Carteira de crédito ativa - por região geográfica"
    - id: "10"
      name: "Carteira de crédito ativa - quantidade de clientes e de operações"
    - id: "11"
      name: "Carteira de crédito ativa Pessoa Física - modalidade e prazo de vencimento"
    - id: "12"
      name: "Carteira de crédito ativa Pessoa Jurídica - por atividade econômica (CNAE)"
    - id: "13"
      name: "Carteira de crédito ativa Pessoa Jurídica - modalidade e prazo de vencimento"
    - id: "14"
      name: "Carteira de crédito ativa Pessoa Jurídica - por porte do tomador"
    - id: "15"
      name: "Movimentação de Câmbio no Trimestre"
    - id: "16"
      name: "Carteira de crédito ativa - por carteiras de instrumentos financeiros"

  institution_types:
    - codigo: 1
      label: "conglomerados_prudenciais"
    - codigo: 2
      label: "conglomerados_financeiros"
    - codigo: 3
      label: "instituicoes_individuais"
    - codigo: 4
      label: "instituicoes_cambio"

  time_range:
    start_year: 2014
    start_month: 3
    quarters: [3, 6, 9, 12]

normalization:
  cosif_mapping: "config/cosif_de_para.csv"
  output:
    dir: "data/processed"
    filename: "ifdata_historical.csv.gz"
    consolidated: "ifdata_consolidated.csv"
